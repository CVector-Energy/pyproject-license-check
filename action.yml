name: Pyproject License Check
description: Check Python project dependencies for license compliance using licensecheck

inputs:
  uv-version:
    description: uv version to use
    required: false
    default: ""
  licensecheck-version:
    description: licensecheck version to use
    required: false
    # Previously pinned to a git SHA to pick up the unreleased fix for https://github.com/FHPythonUtils/LicenseCheck/issues/137. That fix, and the fix for the missing-[tool]-table crash (https://github.com/FHPythonUtils/LicenseCheck/pull/138), are both released as of 2026.0.8.
    default: "2026.0.8"
  skip-dependencies:
    description: Space-separated list of dependencies to skip during license check
    required: false
    default: "wrapt"
  ignore-licenses:
    description: Space-separated list of license types to ignore
    required: false
    default: "MPL"
  requirements-paths:
    description: Paths to search for requirements files (pyproject.toml, requirements.txt)
    required: false
    default: "."
  app-id:
    description: GitHub App ID for accessing private repos (optional)
    required: false
    default: ""
  app-private-key:
    description: GitHub App private key for accessing private repos (optional)
    required: false
    default: ""
  repository-owner:
    description: Repository owner for GitHub App token (defaults to current repo owner)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Create GitHub App Token able to read private repos
      id: app
      if: inputs.app-id != '' && inputs.app-private-key != ''
      uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ inputs.repository-owner || github.repository_owner }}
        permission-contents: read

    - name: Configure git to use app token for private repos
      if: steps.app.outcome == 'success'
      shell: bash
      run: |
        git config --global url."https://x-access-token:${{ steps.app.outputs.token }}@github.com/".insteadOf "https://github.com/"

    - name: Set up uv
      uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      with:
        version: ${{ inputs.uv-version }}

    - name: Run license check
      shell: bash
      run: |
        set -o pipefail

        # Build skip dependencies array if provided
        SKIP_ARGS=()
        if [[ -n "${{ inputs.skip-dependencies }}" ]]; then
          IFS=' ' read -ra SKIP_DEPS <<< "${{ inputs.skip-dependencies }}"
          for dep in "${SKIP_DEPS[@]}"; do
            SKIP_ARGS+=(--skip-dependencies "$dep")
          done
        fi

        # Build ignore licenses args if provided
        IGNORE_ARGS=()
        if [[ -n "${{ inputs.ignore-licenses }}" ]]; then
          IFS=' ' read -ra IGNORE_LICENSES <<< "${{ inputs.ignore-licenses }}"
          for license in "${IGNORE_LICENSES[@]}"; do
            IGNORE_ARGS+=(--ignore-licenses "$license")
          done
        fi

        # Determine uvx --from spec: git URLs use @, PyPI versions use ==
        LICENSECHECK_VERSION="${{ inputs.licensecheck-version }}"
        if [[ "$LICENSECHECK_VERSION" == git+* ]]; then
          FROM_SPEC="licensecheck @ ${LICENSECHECK_VERSION}"
        else
          FROM_SPEC="licensecheck==${LICENSECHECK_VERSION}"
        fi

        # Find requirement sources and write sanitized copies for licensecheck.
        # For pyproject.toml files, keep the direct runtime dependency surface
        # instead of expanding the full transitive graph through uv export.
        # Local uv path/workspace deps are skipped here (they'd crash licensecheck
        # as pip path syntax); their own dependencies are covered when that
        # package's pyproject.toml is scanned, so keep the scan repo-wide.
        SANITIZED_DIR="$(mktemp -d)"
        SANITIZED_PATHS=()

        while IFS= read -r -d '' requirements_path; do
          sanitized_path="$SANITIZED_DIR/${#SANITIZED_PATHS[@]}.requirements.txt"

          if [[ "$(basename "$requirements_path")" == "pyproject.toml" ]]; then
            python3 - "$requirements_path" > "$sanitized_path" <<'PY'
        import re
        import sys
        import tomllib
        from pathlib import Path


        def normalize_name(name):
            return re.sub(r"[-_.]+", "-", name).lower()


        def requirement_name(requirement):
            requirement = requirement.split(";", 1)[0].strip()
            if not requirement or requirement.startswith(("-e ", "--editable ")):
                return None
            if requirement.startswith((".", "/")):
                return None

            match = re.match(r"([A-Za-z0-9][A-Za-z0-9._-]*)\s*(?:\[|[<>=!~ ]|@|$)", requirement)
            if not match:
                return None
            return normalize_name(match.group(1))


        pyproject_path = Path(sys.argv[1])
        pyproject = tomllib.loads(pyproject_path.read_text(encoding="utf-8"))
        uv_sources = pyproject.get("tool", {}).get("uv", {}).get("sources", {})
        local_source_names = {
            normalize_name(name)
            for name, source in uv_sources.items()
            if isinstance(source, dict) and ("path" in source or source.get("workspace") is True)
        }

        dependencies = list(pyproject.get("project", {}).get("dependencies", []))
        optional_dependencies = pyproject.get("project", {}).get("optional-dependencies", {})
        for extra_dependencies in optional_dependencies.values():
            dependencies.extend(extra_dependencies)

        for dependency in dependencies:
            name = requirement_name(dependency)
            if name is None or name in local_source_names:
                continue
            print(dependency)
        PY
          else
            sed \
              -e '/^[[:space:]]*-e[[:space:]]/d' \
              -e '/^[[:space:]]*--editable[[:space:]]/d' \
              -e '/ @ file:\/\//d' \
              -e '/^[[:space:]]*[.\/]/d' \
              "$requirements_path" > "$sanitized_path"
          fi

          if [[ -s "$sanitized_path" ]]; then
            SANITIZED_PATHS+=("$sanitized_path")
          fi
        done < <(
          find ${{ inputs.requirements-paths }} \
            \( -name .git -o -name .hg -o -name .mypy_cache -o -name .pytest_cache -o -name .ruff_cache -o -name .tox -o -name .venv -o -name __pycache__ -o -name build -o -name dist \) -prune -o \
            \( -name 'pyproject.toml' -o -name 'requirements.txt' \) -print0
        )

        if [[ ${#SANITIZED_PATHS[@]} -eq 0 ]]; then
          echo "No Python requirement files found."
          exit 0
        fi

        uvx --from "$FROM_SPEC" python3 - \
          --zero \
          "${SKIP_ARGS[@]}" \
          "${IGNORE_ARGS[@]}" \
          --requirements-paths "${SANITIZED_PATHS[@]}" <<'PY'
        import argparse
        import fnmatch
        import sys
        import tomllib
        from pathlib import Path

        from licensecheck import license_matrix
        from packaging.requirements import InvalidRequirement, Requirement
        from packaging.utils import canonicalize_name

        try:
            from licensecheck.models.constants import JOINS, UNKNOWN
            from licensecheck.packageinforesolver import PackageInfoManager, ProjectMetadata
            from licensecheck.models.packageinfo import PackageInfo
        except ImportError:
            from licensecheck import packageinfo as legacy_packageinfo
            from licensecheck import types as legacy_types

            JOINS = legacy_types.JOINS
            UNKNOWN = legacy_types.UNKNOWN
            PackageInfo = legacy_types.PackageInfo
            PackageInfoManager = legacy_packageinfo.PackageInfoManager
            ProjectMetadata = legacy_packageinfo.ProjectMetadata


        parser = argparse.ArgumentParser()
        parser.add_argument("--zero", action="store_true")
        parser.add_argument("--skip-dependencies", action="append", default=[])
        parser.add_argument("--ignore-licenses", action="append", default=[])
        parser.add_argument("--requirements-paths", nargs="+", required=True)
        args = parser.parse_args()

        config = {}
        if Path("pyproject.toml").exists():
            config = (
                tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
                .get("tool", {})
                .get("licensecheck", {})
            )

        skip_packages = {canonicalize_name(name) for name in args.skip_dependencies}
        ignore_packages = [pattern.upper() for pattern in config.get("ignore_packages", [])]
        ignore_license_names = [
            name.upper()
            for name in [*config.get("ignore_licenses", []), *args.ignore_licenses]
        ]
        ignore_license_types = license_matrix.licenseType(
            JOINS.join(ignore_license_names),
            ignore_license_names,
        )
        project_license_types = license_matrix.licenseType(ProjectMetadata.get_license())
        project_license = next(iter(project_license_types))

        requirements = {}
        for requirements_path in args.requirements_paths:
            with open(requirements_path, encoding="utf-8") as file:
                for line_number, raw_line in enumerate(file, start=1):
                    line = raw_line.strip()
                    if not line or line.startswith("#"):
                        continue
                    try:
                        requirement = Requirement(line)
                    except InvalidRequirement as error:
                        print(
                            f"Invalid requirement in {requirements_path}:{line_number}: {line}",
                            file=sys.stderr,
                        )
                        raise SystemExit(2) from error

                    name = canonicalize_name(requirement.name)
                    if name in skip_packages:
                        continue
                    requirements[name] = requirement

        manager = PackageInfoManager()
        packages = []
        incompatible = []
        errors = []
        for name in sorted(requirements):
            requirement = requirements[name]
            if hasattr(manager, "_get_package_info"):
                package = manager._get_package_info(requirement)
            else:
                package = manager.get_package_info(PackageInfo(name=name))
            package_name = package.name.upper()
            ignored_package = any(
                fnmatch.fnmatch(package_name, pattern)
                for pattern in ignore_packages
            )
            if ignored_package:
                package.licenseCompat = True
            else:
                package_license_types = license_matrix.licenseType(
                    str(package.license or ""),
                    ignore_license_names,
                )
                try:
                    package.licenseCompat = license_matrix.depCompatWMyLice(
                        project_license,
                        package_license_types,
                        ignore_license_types,
                    )
                except (IndexError, KeyError):
                    print(
                        f"Could not compare license for {package.name}: {package.license}",
                        file=sys.stderr,
                    )
                    package.licenseCompat = False
            packages.append(package)
            if package.errorCode and not ignored_package:
                errors.append(package)
            if not package.licenseCompat and not any(
                fnmatch.fnmatch(package_name, pattern.upper())
                for pattern in args.skip_dependencies
            ):
                incompatible.append(package)

        if errors:
            print("Packages with missing metadata:")
            for package in errors:
                print(f"  - {package.name}")

        if packages:
            print("Checked direct packages:")
            for package in packages:
                status = "OK" if package.licenseCompat else "FAIL"
                license_text = package.license or UNKNOWN
                print(f"  {status} {package.name}: {license_text}")
        else:
            print("No direct packages to check.")

        if args.zero and incompatible:
            raise SystemExit(1)
        PY

branding:
  icon: shield
  color: orange
